<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floosy · فلوسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#e8ecf0; --grid:rgba(15,27,38,.05);
  --card:#ffffff; --card2:#f1f4f7; --text:#0f1b26; --muted:#5d6f82; --line:#d2dae2;
  --accent:#d9730d; --accent-ink:#ffffff; --good:#0d9a86; --bad:#d6452a;
  --font:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f14; --grid:rgba(255,255,255,.035);
    --card:#121820; --card2:#18212b; --text:#e6edf3; --muted:#8b9bb0; --line:#243040;
    --accent:#f5a524; --accent-ink:#1a1100; --good:#2dd4bf; --bad:#ff6b4a;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f14; --grid:rgba(255,255,255,.035);
  --card:#121820; --card2:#18212b; --text:#e6edf3; --muted:#8b9bb0; --line:#243040;
  --accent:#f5a524; --accent-ink:#1a1100; --good:#2dd4bf; --bad:#ff6b4a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html[lang="ar"]{--font:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--text);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.i{display:inline-block;vertical-align:-3px;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1020px;margin:0 auto;padding:14px 16px 120px}
.up{font-size:12.5px;color:var(--muted);font-weight:500}
html[lang="en"] .up{text-transform:uppercase;letter-spacing:.09em;font-size:11.5px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.brand b{font-size:19px;display:block;line-height:1.1;font-weight:700}
.tools{display:flex;gap:8px}
.ib{border:1px solid var(--line);background:var(--card);min-width:40px;height:40px;padding:0 10px;border-radius:9px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--text)}
.ib:hover{border-color:var(--accent)}
.ib:active{transform:scale(.95)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar,.wstrip::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--muted);padding:11px 14px;font-weight:500;cursor:pointer;display:flex;gap:7px;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab.on .i{color:var(--accent)}
.chip{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--line);position:relative}
.card::before{content:"";position:absolute;top:-1px;inset-inline-start:16px;width:28px;height:2px;background:var(--accent)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{color:var(--muted);font-weight:400;font-size:12px}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-top:4px}
@media(max-width:480px){.hero{grid-template-columns:1fr}.hero .gauge{justify-self:center}}
.hero-top{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.led{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.big{font-size:clamp(30px,8vw,46px);font-weight:600;letter-spacing:-.5px;margin:2px 0 12px;font-family:var(--mono)}
.hero-sub{display:flex;gap:8px;flex-wrap:wrap}
.hp{border:1px solid var(--line);background:var(--card2);padding:5px 11px;border-radius:7px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.gv{font:600 22px var(--mono);fill:var(--text)}
.gl{font:500 9.5px var(--font);fill:var(--muted)}
.grid{display:grid;gap:14px;margin-top:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat .lab{display:flex;gap:6px;align-items:center}
.stat .val{font-size:21px;font-weight:600;margin-top:6px;font-family:var(--mono)}
.good{color:var(--good)} .bad{color:var(--bad)}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 0;flex-wrap:wrap}
.bar-row h2{margin:0;font-size:18px;font-weight:600}
.sel{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;max-width:100%;outline:none}
.sel:focus{border-color:var(--accent)}
.wstrip{display:flex;gap:12px;overflow-x:auto;padding:14px 0 4px}
.wtile{flex:none;width:182px;border-radius:12px;padding:12px;cursor:pointer;border:1px solid var(--line);background:var(--card);text-align:start}
.wtile.on{border-color:var(--accent)}
.wtile .wt{display:flex;gap:8px;align-items:center;min-width:0}
.wtile .wn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.wtile .wb{font-size:17px;font-weight:600;margin:10px 0 8px;font-family:var(--mono)}
.lvl{height:4px;border-radius:2px;background:var(--card2);overflow:hidden}
.lvl i{display:block;height:100%}
.wadd{flex:none;width:110px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;text-align:center;padding:10px;font-size:13px}
.wadd:hover{border-color:var(--accent);color:var(--accent)}
.chartbox{position:relative;height:220px}
.chartbox.sm{height:190px}
.donutwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;align-items:center}
@media(max-width:520px){.donutwrap{grid-template-columns:1fr}}
.legend .li{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.legend .dot{width:10px;height:10px;border-radius:2px;flex:none}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{color:var(--muted);font-family:var(--mono);font-size:12px}
.tile{display:flex;gap:12px;align-items:center}
.tile .tl{color:var(--muted);font-size:12.5px}
.tile .tv{font-weight:600;font-size:15px}
.tile .ts{color:var(--muted);font-size:12px}
.quote{border-inline-start:3px solid var(--accent);border-radius:4px 12px 12px 4px}
.quote p{margin:6px 0 10px;font-size:17px;font-weight:500;line-height:1.55}
.quote .who{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.quote .qb{margin-top:12px}
.ico{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;flex:none;border:1px solid var(--line);font-size:18px}
.ico.sm{width:30px;height:30px;border-radius:7px;font-size:15px}
.tx{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:10px;cursor:pointer}
.tx:hover{background:var(--card2)}
.tx .mid{flex:1;min-width:0}
.tx .t{font-weight:500}
.tx .s{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:600;white-space:nowrap}
.dayh{color:var(--muted);font-size:12px;padding:14px 6px 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:36px 18px}
.empty .bigico{width:64px;height:64px;border-radius:14px;margin:0 auto 10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.empty h2{margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.fab{position:fixed;inset-inline-end:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:14px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 10px 28px rgba(0,0,0,.35);cursor:pointer;z-index:30;display:grid;place-items:center}
.fab:active{transform:scale(.92)}
.modal{position:fixed;inset:0;background:rgba(3,6,10,.62);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:16px}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mh h3{margin:0;font-size:17px;font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 0}
label input,label select,label textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:15px;outline:none}
label input:focus,label select:focus,.amt-in:focus{border-color:var(--accent)}
.lbl{font-size:13px;color:var(--muted);margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amt-in{width:100%;margin:14px 0 4px;font-size:34px;font-weight:600;text-align:center;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px;outline:none;color:var(--text);font-family:var(--mono)}
.hint{font-size:12.5px;color:var(--muted);text-align:center;min-height:18px}
.seg{display:flex;background:var(--card2);padding:3px;border-radius:10px;gap:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.five{display:grid;grid-template-columns:repeat(6,1fr)}
.seg.five button:nth-child(-n+3){grid-column:span 2}
.seg.five button:nth-child(n+4){grid-column:span 3}
.warn{color:var(--accent)}
.info{color:#60a5fa}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.cat{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:10px 4px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;line-height:1.2}
.cat.on{border-color:var(--accent);background:var(--card)}
.emos{display:flex;flex-wrap:wrap;gap:6px}
.emo{width:42px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card2);cursor:pointer;padding:0;display:grid;place-items:center}
.emo.on{border-color:var(--accent);color:var(--accent);background:var(--card)}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw2{width:28px;height:28px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0}
.sw2.on{border-color:var(--text)}
.mfoot{display:flex;gap:10px;margin-top:18px}
.mfoot .btn{flex:1}
.mcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.mcard .mid{flex:1;min-width:0}
.mcard .t{font-weight:500}
.mlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-top:12px}
.tag{font-size:11px;background:var(--card2);color:var(--muted);padding:2px 8px;border-radius:5px;border:1px solid var(--line);font-weight:400}
.bar{height:6px;border-radius:2px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%}
.brow{padding:8px 0}
.brow .l{display:flex;justify-content:space-between;gap:8px;font-size:14px;align-items:center}
.brow .l span:first-child{display:flex;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;text-align:start;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12.5px}
td.n,th.n{text-align:end}
.sw{position:relative;display:inline-block;width:44px;height:25px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:6px;transition:.2s;cursor:pointer}
.sw span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:4px;background:var(--text);transition:.2s;opacity:.85}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span::after{inset-inline-start:22px;background:var(--accent-ink);opacity:1}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow>span{display:flex;gap:9px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;z-index:80;max-width:90vw;text-align:center}
textarea.big-ta{width:100%;min-height:150px;border-radius:9px;border:1px solid var(--line);background:var(--card2);padding:10px;font-family:var(--mono);font-size:12px;color:var(--text)}
@media print{
  .top,.chips,.tabs,.fab,.noprint,.toast{display:none!important}
  body{background:#fff!important;color:#000;background-image:none}
  .card{border:1px solid #ccc}
}
</style>
</head>

/* ---------- money logic ---------- */
function range(p,off){
  off=off||0;const n=new Date(),y=n.getFullYear(),mo=n.getMonth();let a,b;
  if(p==='month'){a=new Date(y,mo+off,1);b=new Date(y,mo+off+1,0);}
  else if(p==='last'){a=new Date(y,mo-1+off,1);b=new Date(y,mo+off,0);}
  else if(p==='3m'){a=new Date(y,mo-2+off*3,1);b=new Date(y,mo+1+off*3,0);}
  else if(p==='year'){a=new Date(y+off,0,1);b=new Date(y+off,11,31);}
  else return null;
  return [ds(a),ds(b)];
}
const vis=()=>S.wallets.filter(w=>!w.hidden);
const isVis=id=>{const w=walletOf(id);return !!w&&!w.hidden;};
const loanOf=id=>S.tx.find(x=>x.id===id&&(x.type==='lend'||x.type==='borrow'));
const loansAll=()=>S.tx.filter(x=>x.type==='lend'||x.type==='borrow');
function loanInfo(l){let paid=0;for(const x of S.tx)if(x.type==='repay'&&x.loanId===l.id)paid+=x.amount;const rem=Math.max(0,Math.round((l.amount-paid)*1000)/1000);return {paid:paid,rem:rem,done:rem<0.0005};}
const daysTo=d=>Math.round((pd(d)-pd(todayStr()))/864e5);
function loanTotals(){let owed=0,owe=0,next=null;for(const l of loansAll()){const i=loanInfo(l);if(i.done)continue;if(l.type==='lend')owed+=i.rem;else owe+=i.rem;if(l.due&&(!next||l.due<next.due))next=l;}return {owed:owed,owe:owe,next:next};}
function scoped(from,to,w){
  w=w||S.ui.wallet;
  return S.tx.filter(x=>{
    if(from&&x.date<from)return false;
    if(to&&x.date>to)return false;
    if(w!=='all'&&x.wallet!==w&&x.to!==w)return false;
    if(w==='all'&&!isVis(x.wallet)&&!(x.to&&isVis(x.to)))return false;
    return true;
  });
}
const sortTx=l=>l.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
function stats(list){
  let inc=0,exp=0;
  for(const x of list){if(x.type==='in')inc+=x.amount;else if(x.type==='out')exp+=x.amount;}
  return {inc,exp,net:inc-exp,rate:inc>0?(inc-exp)/inc:null};
}
function byCat(list,type){
  const o={};
  for(const x of list)if(x.type===type)o[x.cat]=(o[x.cat]||0)+x.amount;
  return Object.keys(o).map(id=>({id,val:o[id]})).sort((a,b)=>b.val-a.val);
}
function walletBal(w,upto){
  let b=Number(w.start)||0;
  for(const x of S.tx){
    if(upto&&x.date>upto)continue;
    if(x.type==='in'&&x.wallet===w.id)b+=x.amount;
    else if(x.type==='out'&&x.wallet===w.id)b-=x.amount;
    else if(x.type==='lend'&&x.wallet===w.id)b-=x.amount;
    else if(x.type==='borrow'&&x.wallet===w.id)b+=x.amount;
    else if(x.type==='repay'&&x.wallet===w.id){const l=loanOf(x.loanId);if(l)b+=(l.type==='lend'?x.amount:-x.amount);}
    else if(x.type==='transfer'){if(x.wallet===w.id)b-=x.amount;if(x.to===w.id)b+=x.amount;}
  }
  return b;
}
function scopeBal(upto){
  if(S.ui.wallet==='all')return vis().reduce((a,w)=>a+walletBal(w,upto),0);
  const w=walletOf(S.ui.wallet);return w?walletBal(w,upto):0;
}
function periodDays(per,list){
  const r=range(per),today=todayStr();let from,to;
  if(r){from=r[0];to=r[1]<today?r[1]:today;}
  else{from=list.length?list.reduce((a,x)=>x.date<a?x.date:a,list[0].date):today;to=today;}
  return Math.max(1,Math.round((pd(to)-pd(from))/864e5)+1);
}

    pending.push(trendChart);

function insightsHTML(list,st,cats){
  const tiles=[];
  if(cats.length){
    const k=catOf(cats[0].id);
    tiles.push([k.icon,k.color,t('topCat'),esc(cname(k)),pct(cats[0].val/st.exp)+' · '+m(cats[0].val)]);
    const big=list.filter(x=>x.type==='out').sort((a,b)=>b.amount-a.amount)[0];
    if(big){const bk=catOf(big.cat);tiles.push(['bolt','#f5a524',t('biggest'),m(big.amount),esc(cname(bk))+(big.note?' · '+esc(big.note):'')]);}
    tiles.push(['calendar','#60a5fa',t('dailyAvg'),m(st.exp/periodDays(S.ui.period,list)),'']);
  }
  const r=range(S.ui.period);
  if(r){
    const pr=range(S.ui.period,-1),pe=stats(scoped(pr[0],pr[1])).exp;
    if(pe>0&&st.exp>0){
      const ch=(st.exp-pe)/pe;
      tiles.push(['trend',ch>0?'#ff6b4a':'#2dd4bf',t('vsPrev'),'<span class="mono '+(ch>0?'bad':'good')+'">'+(ch>0?'+':'−')+Math.abs(Math.round(ch*100))+'%</span>',ch>0?t('moreSpent'):t('lessSpent')]);
    }
  }
  tiles.push(['list','#94a3b8',t('txCount'),'<span class="mono">'+list.length+'</span>','']);
  if(tiles.length<2)return '';
  return '<section class="card" style="margin-top:14px"><h3>'+t('insights')+'</h3><div class="grid g2" style="margin:0">'+
    tiles.map(x=>'<div class="tile">'+iconTile(x[0],x[1])+'<div><div class="tl">'+x[2]+'</div><div class="tv">'+x[3]+'</div>'+(x[4]?'<div class="ts">'+x[4]+'</div>':'')+'</div></div>').join('')+'</div></section>';
}

const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const shortNum=v=>Math.abs(v)>=1000?(v/1000).toFixed(v%1000===0?0:1)+'k':String(Math.round(v));
function axisOpts(){
  const mu=cssv('--muted'),ln=cssv('--line'),mono="'IBM Plex Mono',monospace";
  return {x:{grid:{display:false},ticks:{color:mu}},y:{grid:{color:ln},border:{display:false},ticks:{color:mu,font:{family:mono,size:11},callback:v=>S.settings.hide?'':shortNum(v)}}};

function donutChart(items){
  charts.push(new Chart($('#c-donut'),{type:'doughnut',data:{labels:items.map(i=>i.name),datasets:[{data:items.map(i=>i.val),backgroundColor:items.map(i=>i.color),borderColor:cssv('--card'),borderWidth:3,hoverOffset:4}]},

function barsChart(){
  const n=new Date(),labels=[],inc=[],exp=[];
  for(let i=5;i>=0;i--){
    const d=new Date(n.getFullYear(),n.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);
    const st=stats(scoped(ds(d),ds(e)));labels.push(fmonth(d));inc.push(st.inc);exp.push(st.exp);
  }
  charts.push(new Chart($('#c-bars'),{type:'bar',data:{labels,datasets:[
    {label:t('income'),data:inc,backgroundColor:cssv('--good'),borderRadius:3,maxBarThickness:20},
    {label:t('expense'),data:exp,backgroundColor:cssv('--bad'),borderRadius:3,maxBarThickness:20}]},
    options:{responsive:true,maintainAspectRatio:false,scales:axisOpts(),plugins:{legend:{display:true,labels:{color:cssv('--muted'),usePointStyle:true,pointStyle:'rect',boxWidth:8}},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+mt(c.parsed.y)}}}}}));
}
function trendChart(){
  const labels=[],vals=[],n=new Date();
  for(let i=29;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i);labels.push(d.getDate()+' '+fmonth(d));vals.push(scopeBal(ds(d)));}
  const ac=cssv('--accent');
  charts.push(new Chart($('#c-trend'),{type:'line',data:{labels,datasets:[{data:vals,borderColor:ac,borderWidth:2.5,tension:.25,pointRadius:0,pointHoverRadius:5,fill:true,
    backgroundColor:ctx=>{const a=ctx.chart.chartArea;if(!a)return null;const g=ctx.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);g.addColorStop(0,hexA(ac,.28));g.addColorStop(1,hexA(ac,0));return g;}}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{x:{grid:{display:false},ticks:{color:cssv('--muted'),maxTicksLimit:6}},y:axisOpts().y},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+mt(c.parsed.y)}}}}}));
}

/* ---------- ACTIVITY ---------- */
function txRow(x){
  let icn,col,title,sub,amt,cls='';
  if(x.type==='lend'||x.type==='borrow'||x.type==='repay'){
    const l=x.type==='repay'?loanOf(x.loanId):x,pn=l?l.person:'?';
    col=x.type==='borrow'?'#60a5fa':(x.type==='repay'?'#2dd4bf':'#f5a524');
    icn=x.type==='lend'?'lend':(x.type==='borrow'?'borrow':'check');
    if(x.type==='lend'){title=t('lentTo',{n:pn});amt=m(-x.amount);cls='warn';}
    else if(x.type==='borrow'){title=t('borrowedFrom',{n:pn});amt='+'+m(x.amount);cls='info';}
    else if(l&&l.type==='lend'){title=t('repayFrom',{n:pn});amt='+'+m(x.amount);cls='good';}
    else{title=t('repayTo',{n:pn});amt=m(-x.amount);cls='warn';}
    sub=esc(wname(x.wallet))+(x.type!=='repay'&&x.due?' · '+t('dueLbl')+' '+x.due:'')+(x.note?' · '+esc(x.note):'');
  }else if(x.type==='transfer'){
    icn='swap';col='#94a3b8';title=t('typeTr');sub=esc(wname(x.wallet))+' ⇄ '+esc(wname(x.to))+(x.note?' · '+esc(x.note):'');
    const sw=S.ui.wallet;
    if(sw==='all'){amt=m(x.amount);cls='muted';}
    else if(sw===x.wallet){amt=m(-x.amount);cls='bad';}
    else{amt='+'+m(x.amount);cls='good';}
  }else{
    const c=catOf(x.cat);icn=c.icon;col=c.color;title=cname(c);
    sub=esc(wname(x.wallet))+(x.note?' · '+esc(x.note):'');
    amt=x.type==='in'?'+'+m(x.amount):m(-x.amount);cls=x.type==='in'?'good':'bad';
  }
  return '<div class="tx" data-act="editTx" data-id="'+x.id+'">'+iconTile(icn,col)+'<div class="mid"><div class="t">'+esc(title)+'</div><div class="s">'+sub+'</div></div><div class="a '+cls+'">'+amt+'</div></div>';
}
function filteredTx(){
  const r=range(S.ui.period);
  let l=scoped(r?r[0]:null,r?r[1]:null);
  if(S.ui.type==='loans')l=l.filter(x=>x.type==='lend'||x.type==='borrow'||x.type==='repay');
  else if(S.ui.type!=='all')l=l.filter(x=>x.type===S.ui.type);
  if(S.ui.cat!=='all')l=l.filter(x=>x.cat===S.ui.cat);
  const q=(S.ui.q||'').trim().toLowerCase();
  if(q)l=l.filter(x=>((x.note||'')+' '+(x.person||'')+' '+(x.cat?(catOf(x.cat).n+' '+catOf(x.cat).a):'')+' '+wname(x.wallet)).toLowerCase().indexOf(q)>-1);
  return sortTx(l);
}
function listHTML(){
  const l=filteredTx();
  if(!l.length)return '<p class="muted" style="text-align:center;padding:20px">'+t('noTx')+'</p>';

    if(x.date!==cur){cur=x.date;h+='<div class="dayh">'+fdate(cur)+'</div>';}

/* ---------- LOANS ---------- */
function loansWidget(){
  const lo=loanTotals();if(!(lo.owed>0||lo.owe>0))return '';
  let nx='';
  if(lo.next){const dd=daysTo(lo.next.due);nx='<div class="muted" style="font-size:12.5px;margin-top:8px">'+esc(lo.next.person)+' · '+(dd<0?'<span class="bad">'+t('overdue',{n:-dd})+'</span>':(dd===0?t('dueToday'):t('dueIn',{n:dd})))+'</div>';}
  return '<section class="card" style="margin-top:14px;cursor:pointer" data-act="tab" data-id="loans"><h3>'+t('tab_loans')+'<small>'+ic('users',14)+'</small></h3><div class="row" style="gap:28px"><div><div class="up">'+t('owedToMe')+'</div><div class="mono warn" style="font-size:19px;font-weight:600">'+m(lo.owed)+'</div></div><div><div class="up">'+t('iOwe')+'</div><div class="mono info" style="font-size:19px;font-weight:600">'+m(lo.owe)+'</div></div></div>'+nx+'</section>';
}
function loanCard(l){
  const i=loanInfo(l),lend=l.type==='lend',col=lend?'#f5a524':'#60a5fa';
  let due='';
  if(l.due&&!i.done){const dd=daysTo(l.due);due=(dd<0?'<span class="bad">'+t('overdue',{n:-dd})+'</span>':(dd===0?'<span class="warn">'+t('dueToday')+'</span>':'<span>'+t('dueIn',{n:dd})+'</span>'))+' <span class="muted">· '+fdate(l.due)+'</span>';}
  else if(!l.due&&!i.done)due='<span class="muted">'+t('noDue')+'</span>';
  const reps=S.tx.filter(x=>x.type==='repay'&&x.loanId===l.id).sort((a,b)=>a.date<b.date?-1:1);
  const prog=Math.round(Math.min(1,i.paid/l.amount)*100);
  return '<div class="card" style="margin-top:12px"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">'+iconTile(lend?'lend':'borrow',col)+
   '<div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(l.person)+' <span class="tag">'+(lend?t('lentLbl'):t('borrowedLbl'))+'</span></div>'+
   '<div class="muted" style="font-size:12.5px">'+fdate(l.date)+' · '+esc(wname(l.wallet))+(l.note?' · '+esc(l.note):'')+'</div>'+(due?'<div style="font-size:13px;margin-top:2px">'+due+'</div>':'')+'</div>'+
   '<div style="text-align:end"><div class="mono" style="font-size:18px;font-weight:600;color:'+col+'">'+m(i.rem)+'</div><div class="muted" style="font-size:12px">'+t('ofAmt',{a:mt(l.amount)})+'</div></div></div>'+
   '<div class="bar"><i style="width:'+prog+'%;background:'+(i.done?'var(--good)':col)+'"></i></div>'+
   (reps.length?'<div style="margin-top:8px">'+reps.map(x=>'<div class="tx" data-act="editTx" data-id="'+x.id+'" style="padding:5px 6px"><span style="color:var(--good)">'+ic('check',16)+'</span><div class="mid"><div class="s">'+fdate(x.date)+(x.note?' · '+esc(x.note):'')+'</div></div><div class="a good mono" style="font-size:13px">'+m(x.amount)+'</div></div>').join('')+'</div>':'')+
   '<div class="row" style="margin-top:10px">'+(i.done?'<span class="tag" style="color:var(--good)">'+ic('check',12)+' '+t('settledLbl')+'</span>':'<button class="btn sm" data-act="repay" data-id="'+l.id+'">'+ic('check',14)+t('recordRepay')+'</button>')+'<button class="ib" style="height:32px;min-width:32px" data-act="editTx" data-id="'+l.id+'">'+ic('edit',15)+'</button></div></div>';
}
function loansView(){
  const lo=loanTotals(),all=loansAll();
  const open=all.filter(l=>!loanInfo(l).done).sort((a,b)=>(a.due||'9999')<(b.due||'9999')?-1:1);
  const done=all.filter(l=>loanInfo(l).done).sort((a,b)=>a.date<b.date?1:-1);
  let h='<div class="bar-row"><h2>'+t('tab_loans')+'</h2><div class="row"><button class="btn" data-act="addLoan" data-kind="lend">'+ic('lend',16)+t('typeLend')+'</button><button class="btn ghost" data-act="addLoan" data-kind="borrow">'+ic('borrow',16)+t('typeBorrow')+'</button></div></div>';
  h+='<div class="grid g4"><div class="card stat"><div class="lab up">'+ic('lend',14)+t('owedToMe')+'</div><div class="val warn">'+m(lo.owed)+'</div></div><div class="card stat"><div class="lab up">'+ic('borrow',14)+t('iOwe')+'</div><div class="val info">'+m(lo.owe)+'</div></div><div class="card stat"><div class="lab up">'+ic('scale',14)+t('netLoans')+'</div><div class="val '+(lo.owed-lo.owe>=0?'good':'bad')+'">'+m(lo.owed-lo.owe)+'</div></div></div>';
  if(!all.length)return h+'<section class="card empty" style="margin-top:14px"><div class="bigico">'+ic('users',32)+'</div><p class="muted">'+t('noLoans')+'</p></section>';
  if(open.length)h+='<h3 class="up" style="margin:20px 0 0">'+t('openLoans')+'</h3>'+open.map(loanCard).join('');
  if(done.length)h+='<h3 class="up" style="margin:24px 0 0">'+t('settledLoans')+'</h3>'+done.map(loanCard).join('');
  return h;
}

/* ---------- modal + toast ---------- */
function openModal(html){const s=$('#sheet');s.innerHTML=html;$('#modal').hidden=false;return s;}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML='';}
let tt;
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true;},2000);}
function confirmBox(msg,yes){
  const s=openModal('<div class="mh"><h3 style="display:flex;gap:8px;align-items:center;color:var(--bad)">'+ic('warn',20)+'</h3></div><p>'+esc(msg)+'</p><div class="mfoot"><button class="btn ghost" data-act="closeModal">'+t('cancel')+'</button><button class="btn danger" id="yes">'+t('del')+'</button></div>');
  $('#yes',s).onclick=()=>{closeModal();yes();};
}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);toast(t('copied'));}
  catch(e){
    const s=openModal('<div class="mh"><h3>'+ic('copy',20)+'</h3><button class="ib" data-act="closeModal">'+ic('x',18)+'</button></div><textarea class="big-ta" readonly id="ta"></textarea>');
    const ta=$('#ta',s);ta.value=txt;ta.focus();ta.select();
  }
}

/* ---------- forms ---------- */
function iconPicker(list,sel){
  const custom=ICONS[sel]?'':sel;
  return '<div class="emos">'+list.map(e=>'<button type="button" class="emo '+(e===sel?'on':'')+'" data-emo="'+e+'">'+ic(e,20)+'</button>').join('')+'</div><label>'+t('customEmoji')+'<input name="emo" maxlength="8" value="'+esc(custom)+'"></label>';
}
function swatches(sel){return '<div class="sws">'+PAL.map(c=>'<button type="button" class="sw2 '+(c===sel?'on':'')+'" style="background:'+c+'" data-sw="'+c+'"></button>').join('')+'</div>';}
function bindPickers(root,d){
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-emo]');
    if(b){d.icon=b.dataset.emo;root.querySelectorAll('[data-emo]').forEach(x=>x.classList.toggle('on',x===b));const c=root.querySelector('[name=emo]');if(c)c.value='';return;}
    const s=e.target.closest('[data-sw]');
    if(s){d.color=s.dataset.sw;root.querySelectorAll('[data-sw]').forEach(x=>x.classList.toggle('on',x===s));return;}
    const k=e.target.closest('[data-kind]');
    if(k){d.kind=k.dataset.kind;root.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('on',x===k));}
  });
}

   '<div class="lbl">'+t('icon')+'</div>'+iconPicker(WALLET_ICONS,d.icon)+'<div class="lbl">'+t('color')+'</div>'+swatches(d.color)+
   '<div class="setrow" style="margin-top:10px"><span>'+ic('eyeoff',18)+t('hideWallet')+'</span><label class="sw" style="margin:0"><input type="checkbox" name="hid" '+((ed&&ed.hidden)?'checked':'')+'><span></span></label></div>'+
   '<div class="mfoot">'+(ed?'<button type="button" class="btn danger" id="dw" style="flex:none">'+ic('trash',18)+'</button>':'')+'<button class="btn" type="submit">'+t('save')+'</button></div></form>');
  bindPickers(s,d);

    else{S.wallets.push({id:uid(),name,icon,color:d.color,kind:d.kind,start:nb,hidden:f.hid.checked});}

function txModal(id,preset){
  if(!S.wallets.length){toast(t('needWallet'));go('wallets');return;}
  const ed=id?S.tx.find(x=>x.id===id):null;
  const d=ed?{type:ed.type,amount:String(ed.amount),wallet:ed.wallet,to:ed.to||'',cat:ed.cat||'',date:ed.date,note:ed.note||'',person:ed.person||'',due:ed.due||''}
            :{type:preset||'out',amount:'',wallet:S.ui.wallet!=='all'?S.ui.wallet:(vis()[0]||S.wallets[0]).id,to:'',cat:'other',date:todayStr(),note:'',person:'',due:''};
  const sheet=openModal('');
  const read=()=>{const g=i=>sheet.querySelector(i);if(g('#amt'))d.amount=g('#amt').value;if(g('#nt'))d.note=g('#nt').value;if(g('#dt'))d.date=g('#dt').value;if(g('#wal'))d.wallet=g('#wal').value;if(g('#wto'))d.to=g('#wto').value;if(g('#pn'))d.person=g('#pn').value;if(g('#du'))d.due=g('#du').value;};
  const hintUpdate=()=>{const v=parseNum(d.amount),nt=(d.type==='out'||d.type==='in');$('#hint',sheet).textContent=(nt&&v>0&&v<S.settings.threshold)?t('smallHint',{n:S.settings.threshold}):'';};
  function draw(){
    const isT=d.type==='transfer',isL=(d.type==='lend'||d.type==='borrow'),kind=d.type==='in'?'in':'out';
    const cats=S.categories.filter(c=>c.kind===kind&&(!c.hidden||c.id===d.cat));
    if(!isT&&!isL&&!cats.find(c=>c.id===d.cat)){const o=cats.find(c=>c.id===(kind==='in'?'otherin':'other'))||cats[0];d.cat=o?o.id:'';}
    if(isT&&(!d.to||d.to===d.wallet)){const o=S.wallets.find(w=>w.id!==d.wallet);d.to=o?o.id:'';}
    const opts=sel=>S.wallets.map(w=>'<option value="'+w.id+'" '+(w.id===sel?'selected':'')+'>'+esc(w.name)+(w.hidden?' · '+t('hiddenTag'):'')+'</option>').join('');
    const types={out:ic('down',15)+t('typeOut'),in:ic('up',15)+t('typeIn'),transfer:ic('swap',15)+t('typeTr'),lend:ic('lend',15)+t('typeLend'),borrow:ic('borrow',15)+t('typeBorrow')};
    let mid;
    if(isT)mid='<div class="two"><label>'+t('from')+'<select id="wal">'+opts(d.wallet)+'</select></label><label>'+t('to')+'<select id="wto">'+opts(d.to)+'</select></label></div><label>'+t('date')+'<input type="date" id="dt" value="'+d.date+'"></label>';
    else if(isL)mid='<label>'+t('person')+'<input id="pn" maxlength="40" value="'+esc(d.person)+'"></label><div class="two"><label>'+t('wallet')+'<select id="wal">'+opts(d.wallet)+'</select></label><label>'+t('date')+'<input type="date" id="dt" value="'+d.date+'"></label></div><label>'+t('dueDate')+'<input type="date" id="du" value="'+d.due+'"></label>';
    else mid='<div class="two"><label>'+t('wallet')+'<select id="wal">'+opts(d.wallet)+'</select></label><label>'+t('date')+'<input type="date" id="dt" value="'+d.date+'"></label></div>'+
          '<div class="lbl">'+t('category')+'</div><div class="cats">'+cats.map(c=>'<button type="button" class="cat '+(c.id===d.cat?'on':'')+'" data-cat="'+c.id+'"><span style="color:'+c.color+'">'+ico(c.icon,24)+'</span>'+esc(cname(c))+'</button>').join('')+'</div>';
    sheet.innerHTML='<div class="mh"><h3>'+(ed?t('editTx'):t('addTx'))+'</h3><button class="ib" data-act="closeModal">'+ic('x',18)+'</button></div><form id="mf">'+
     '<div class="seg five">'+Object.keys(types).map(k=>'<button type="button" data-type="'+k+'" class="'+(d.type===k?'on':'')+'">'+types[k]+'</button>').join('')+'</div>'+
     '<input class="amt-in" id="amt" inputmode="decimal" placeholder="0.000" autocomplete="off" value="'+esc(d.amount)+'"><div class="hint" id="hint"></div>'+mid+
     '<label>'+t('note')+'<input id="nt" maxlength="80" value="'+esc(d.note)+'"></label>'+
     '<div class="mfoot">'+(ed?'<button type="button" class="btn danger" id="dtx" style="flex:none">'+ic('trash',18)+'</button>':'')+'<button class="btn" type="submit">'+t('save')+'</button></div></form>';
    sheet.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{read();d.type=b.dataset.type;draw();});
    sheet.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{d.cat=b.dataset.cat;sheet.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('on',x===b));});
    $('#amt',sheet).addEventListener('input',e=>{d.amount=e.target.value;hintUpdate();});
    hintUpdate();
    const dtx=$('#dtx',sheet);
    const wasLoan=ed&&(ed.type==='lend'||ed.type==='borrow');
    if(dtx)dtx.onclick=()=>confirmBox(wasLoan?t('cDelLoan'):t('cDelTx'),()=>{S.tx=S.tx.filter(x=>x.id!==ed.id&&!(x.type==='repay'&&x.loanId===ed.id));toast(t('deleted'));render();});
    $('#mf',sheet).onsubmit=ev=>{
      ev.preventDefault();read();
      const a=Math.round(parseNum(d.amount)*1000)/1000;
      if(!(a>0)){toast(t('needAmount'));return;}
      if(isT&&(!d.to||d.wallet===d.to)){toast(t('diffWallets'));return;}
      if(isL&&!(d.person||'').trim()){toast(t('needPerson'));return;}
      const rec={id:ed?ed.id:uid(),ts:ed?ed.ts:Date.now(),type:d.type,amount:a,wallet:d.wallet,date:d.date||todayStr(),note:(d.note||'').trim()};
      if(isT)rec.to=d.to;else if(isL){rec.person=d.person.trim();if(d.due)rec.due=d.due;}else rec.cat=d.cat;
      if(ed)S.tx[S.tx.findIndex(x=>x.id===ed.id)]=rec;else S.tx.push(rec);
      closeModal();toast(t('saved'));render();
    };
    if(!ed&&!d.amount)$('#amt',sheet).focus();
  }
  draw();
}
function repayModal(loanId,repayId){
  const l=loanOf(loanId);if(!l)return;
  const ed=repayId?S.tx.find(x=>x.id===repayId):null;
  const info=loanInfo(l),maxAmt=Math.round((info.rem+(ed?ed.amount:0))*1000)/1000;
  const w0=walletOf(ed?ed.wallet:l.wallet)?(ed?ed.wallet:l.wallet):S.wallets[0].id;
  const opts=S.wallets.map(w=>'<option value="'+w.id+'" '+(w.id===w0?'selected':'')+'>'+esc(w.name)+(w.hidden?' · '+t('hiddenTag'):'')+'</option>').join('');
  const s=openModal('<div class="mh"><h3>'+(l.type==='lend'?t('repayTitleLend'):t('repayTitleBorrow'))+'</h3><button class="ib" data-act="closeModal">'+ic('x',18)+'</button></div>'+
   '<div class="muted">'+esc(l.person)+' · '+t('remaining')+' '+m(maxAmt)+'</div>'+
   '<form id="mf"><input class="amt-in" id="amt" inputmode="decimal" autocomplete="off" value="'+(ed?ed.amount:maxAmt)+'">'+
   '<div class="two"><label>'+t('wallet')+'<select id="wal">'+opts+'</select></label><label>'+t('date')+'<input type="date" id="dt" value="'+(ed?ed.date:todayStr())+'"></label></div>'+
   '<label>'+t('note')+'<input id="nt" maxlength="80" value="'+esc(ed?ed.note||'':'')+'"></label>'+
   '<div class="mfoot">'+(ed?'<button type="button" class="btn danger" id="dr" style="flex:none">'+ic('trash',18)+'</button>':'')+'<button class="btn" type="submit">'+t('save')+'</button></div></form>');
  $('#mf',s).onsubmit=ev=>{
    ev.preventDefault();
    const a=Math.round(parseNum($('#amt',s).value)*1000)/1000;

  };
  const dr=$('#dr',s);

}
function backupModal(){
  const data=JSON.stringify({settings:S.settings,wallets:S.wallets,categories:S.categories,tx:S.tx});
  const s=openModal('<div class="mh"><h3>'+t('backup')+'</h3><button class="ib" data-act="closeModal">'+ic('x',18)+'</button></div><textarea class="big-ta" id="ta"></textarea><div class="mfoot"><button class="btn ghost" id="cp">'+ic('copy',16)+t('copyBackup')+'</button><button class="btn" id="rs">'+t('restore')+'</button></div>');
  const ta=$('#ta',s);ta.value=data;
  $('#cp',s).onclick=()=>{ta.select();copyText(ta.value);};
  $('#rs',s).onclick=()=>{
    try{
      const o=JSON.parse(ta.value);
      if(!o||!Array.isArray(o.wallets)||!Array.isArray(o.tx)||!Array.isArray(o.categories))throw 0;
      const f=fresh();
      S={...S,settings:{...f.settings,...(o.settings||{}),widgets:{...f.settings.widgets,...((o.settings||{}).widgets||{})}},wallets:o.wallets,categories:o.categories,tx:o.tx};
      closeModal();toast(t('restored'));render();
    }catch(e){toast(t('badBackup'));}
  };
}

/* ---------- sample data ---------- */
function sampleData(){
  const ar=L()==='ar';
  S.wallets=[
    {id:'w1',name:ar?'الحساب الرئيسي':'Main account',icon:'landmark',color:PAL[0],kind:'bank',start:600},
    {id:'w2',name:ar?'كاش':'Cash',icon:'banknote',color:PAL[3],kind:'cash',start:90},
    {id:'w3',name:ar?'الادخار':'Savings',icon:'coins',color:PAL[1],kind:'saving',start:1500}];
  S.categories=defaultCats();S.tx=[];S.ui.wallet='all';
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const rr=(a,b)=>Math.round((a+rnd()*(b-a))*1000)/1000;
  const n=new Date(),today=todayStr();
  const add=(mo,day,type,amt,wallet,cat,note,to)=>{
    const dt=ds(new Date(n.getFullYear(),n.getMonth()+mo,Math.min(day,28)));
    if(dt>today)return;
    const x={id:uid(),ts:Date.now()+S.tx.length,type:type,amount:amt,wallet:wallet,date:dt,note:note||''};
    if(type==='transfer')x.to=to;else x.cat=cat;
    S.tx.push(x);
  };
  for(let mo=-3;mo<=0;mo++){
    add(mo,1,'in',1250,'w1','salary',ar?'الراتب':'Salary');
    add(mo,3,'out',260,'w1','rent');
    add(mo,6,'out',rr(32,58),'w1','bills');
    add(mo,10,'transfer',200,'w1',null,'','w3');
    for(let i=0;i<2;i++)add(mo,5+i*9,'out',rr(30,75),'w1','groc');
    for(let i=0;i<3;i++)add(mo,4+i*7,'out',rr(11,29),'w2','food');
    for(let i=0;i<2;i++)add(mo,7+i*11,'out',rr(11,19),'w2','fuel');
    add(mo,14,'out',rr(40,120),'w1','shop');
    add(mo,17,'out',rr(12,32),'w2','fun');
    add(mo,21,'out',20,'w1','charity');
    if(rnd()>.5)add(mo,19,'out',rr(15,48),'w1','health');
    if(mo===-2)add(mo,12,'out',85,'w1','car',ar?'صيانة':'Service');
    if(mo===-1){add(mo,15,'out',180,'w1','travel');add(mo,24,'in',60,'w2','gift');}
    if(mo===0)add(mo,2,'in',rr(40,90),'w2','side');
  }
}

/* ---------- events ---------- */
const actions={
  tab:el=>go(el.dataset.id),
  pick:el=>{S.ui.wallet=el.dataset.id;render();},
  hide:()=>{S.settings.hide=!S.settings.hide;render();},
  lang:()=>{S.settings.lang=L()==='ar'?'en':'ar';render();},
  theme:()=>{S.settings.theme=isDark()?'light':'dark';render();},
  setLang:el=>{S.settings.lang=el.dataset.v;render();},
  setTheme:el=>{S.settings.theme=el.dataset.v;render();},
  addTx:()=>txModal(),
  editTx:el=>{const x=S.tx.find(q=>q.id===el.dataset.id);if(x&&x.type==='repay')repayModal(x.loanId,x.id);else txModal(el.dataset.id);},
  addLoan:el=>txModal(null,el.dataset.kind),
  repay:el=>repayModal(el.dataset.id),
  toggleWallet:el=>{const w=walletOf(el.dataset.id);if(w){w.hidden=!w.hidden;render();}},
  addWallet:()=>walletModal(),
  editWallet:el=>walletModal(el.dataset.id),
  addCat:el=>catModal(null,el.dataset.kind),
  editCat:el=>catModal(el.dataset.id),
  toggleCat:el=>{const c=S.categories.find(x=>x.id===el.dataset.id);if(c){c.hidden=!c.hidden;render();}},
  nextQuote:()=>{quoteIdx=((quoteIdx||0)+1)%QUOTES.length;render();},
  closeModal:()=>closeModal(),
  copyReport:()=>copyText(reportText()),
  copyCsv:()=>copyText(csvText()),
  print:()=>{try{window.print();}catch(e){}},
  backup:()=>backupModal(),
  seed:()=>confirmBox(t('cSeed'),()=>{const k={lang:S.settings.lang,theme:S.settings.theme};S=seedState();S.settings.lang=k.lang;S.settings.theme=k.theme;render();}),
  sample:()=>{
    const run=()=>{sampleData();render();};
    if(S.wallets.length||S.tx.length)confirmBox(t('cSample'),run);else run();
  },
  reset:()=>confirmBox(t('cReset'),()=>{const keep={lang:S.settings.lang,theme:S.settings.theme};S=fresh();S.settings.lang=keep.lang;S.settings.theme=keep.theme;render();})
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return;}
  const el=e.target.closest('[data-act]');
  if(el&&actions[el.dataset.act])actions[el.dataset.act](el,e);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='per'){S.ui.period=el.value;render();}
  else if(el.id==='ftype'){S.ui.type=el.value;render();}
  else if(el.id==='fcat'){S.ui.cat=el.value;render();}
  else if(el.dataset&&el.dataset.w){S.settings.widgets[el.dataset.w]=el.checked;save();}
  else if(el.dataset&&el.dataset.hide!==undefined){S.settings.hide=el.checked;render();}
  else if(el.id==='thr'){const v=parseNum(el.value);if(v>=0){S.settings.threshold=v;save();toast(t('saved'));}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();});
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.settings.theme==='auto')render();});}catch(e){}}
render();
</script>
</body>
